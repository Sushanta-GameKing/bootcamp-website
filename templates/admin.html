<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ICT & AI Bootcamp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/admin.css') }}">
</head>
<body>
    <main class="admin-shell">
        <div class="admin-card">
            <div class="admin-branding">
                <span class="brand-icon">🔐</span>
                <div>
                    <h1>ICT & AI Bootcamp</h1>
                    <p>Admin Authentication Portal</p>
                </div>
            </div>

            <form class="admin-form" method="post" action="/admin">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Enter admin username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter password" required>
                </div>

                <div class="form-meta-row">
                    <label class="switch">
                        <input type="checkbox" name="remember">
                        <span class="slider"></span>
                    </label>
                    <span>Remember Me</span>
                    <a href="#" class="forgot-link">Forgot?</a>
                </div>

                <button type="submit" class="btn btn-primary admin-btn">Secure Login →</button>
            </form>

            <div class="admin-footer">
                <span>Need access?</span>
                <a href="#">Contact System Admin</a>
            </div>
        </div>
    </main>
</body>
</html>
